<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img"><title>Nissan</title>
  <defs>
    <linearGradient id="ns-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/>
      <stop offset="0.3" stop-color="#C0C0C0"/>
      <stop offset="0.6" stop-color="#707070"/>
      <stop offset="1" stop-color="#C8C8C8"/>
    </linearGradient>
    <linearGradient id="ns-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0E0E0"/>
      <stop offset="0.5" stop-color="#909090"/>
      <stop offset="1" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>
  <!-- Outer oval -->
  <ellipse cx="120" cy="40" rx="117" ry="35" fill="none" stroke="url(#ns-chrome)" stroke-width="4"/>
  <!-- Inner oval -->
  <ellipse cx="120" cy="40" rx="110" ry="28" fill="none" stroke="url(#ns-chrome)" stroke-width="1" opacity="0.6"/>
  <!-- Horizontal chrome bar through center -->
  <rect x="3" y="32" width="234" height="16" rx="8" fill="url(#ns-bar)"/>
  <!-- NISSAN text over bar -->
  <text x="120" y="45" text-anchor="middle" font-size="14" font-weight="900" font-family="Arial Black,Arial,sans-serif" fill="#111" letter-spacing="3">NISSAN</text>
</svg>
