<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" role="img"><title>Cadillac</title>
  <defs>
    <linearGradient id="cd-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D878"/>
      <stop offset="0.5" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#E8C860"/>
    </linearGradient>
  </defs>
  <!-- Wreath/laurel outer border -->
  <ellipse cx="70" cy="50" rx="68" ry="47" fill="none" stroke="url(#cd-gold)" stroke-width="3"/>
  <ellipse cx="70" cy="50" rx="62" ry="41" fill="none" stroke="url(#cd-gold)" stroke-width="1" opacity="0.5"/>
  <!-- Shield shape -->
  <path d="M44,20 L96,20 L96,64 Q96,78 70,86 Q44,78 44,64 Z" fill="#00205B"/>
  <path d="M44,20 L96,20 L96,64 Q96,78 70,86 Q44,78 44,64 Z" fill="none" stroke="url(#cd-gold)" stroke-width="1.5"/>
  <!-- Gold vertical center stripe -->
  <path d="M66,20 L74,20 L74,85 Q72,86 70,86 Q68,86 66,85 Z" fill="url(#cd-gold)"/>
  <!-- Top left: red/white stripes -->
  <rect x="44" y="20" width="22" height="23" fill="#C41230"/>
  <line x1="48" y1="20" x2="48" y2="43" stroke="white" stroke-width="1.5"/>
  <line x1="52" y1="20" x2="52" y2="43" stroke="white" stroke-width="1.5"/>
  <line x1="56" y1="20" x2="56" y2="43" stroke="white" stroke-width="1.5"/>
  <line x1="60" y1="20" x2="60" y2="43" stroke="white" stroke-width="1.5"/>
  <!-- Top right: gold with black birds -->
  <rect x="74" y="20" width="22" height="23" fill="url(#cd-gold)"/>
  <ellipse cx="80" cy="29" rx="3" ry="2" fill="#1A1A1A" transform="rotate(-15 80 29)"/>
  <ellipse cx="91" cy="33" rx="3" ry="2" fill="#1A1A1A" transform="rotate(-15 91 33)"/>
  <!-- Bottom left: gold with black birds -->
  <path d="M44,43 L66,43 L66,64 Q66,72 58,77 L44,64 Z" fill="url(#cd-gold)"/>
  <ellipse cx="50" cy="52" rx="3" ry="2" fill="#1A1A1A" transform="rotate(-15 50 52)"/>
  <ellipse cx="58" cy="62" rx="3" ry="2" fill="#1A1A1A" transform="rotate(-15 58 62)"/>
  <!-- Bottom right: red/white stripes -->
  <path d="M74,43 L96,43 L96,64 Q96,72 82,77 L74,64 Z" fill="#C41230"/>
  <line x1="78" y1="43" x2="78" y2="73" stroke="white" stroke-width="1.5"/>
  <line x1="82" y1="43" x2="82" y2="76" stroke="white" stroke-width="1.5"/>
  <line x1="86" y1="43" x2="86" y2="74" stroke="white" stroke-width="1.5"/>
  <line x1="90" y1="43" x2="90" y2="70" stroke="white" stroke-width="1.5"/>
  <!-- Horizontal center divider -->
  <line x1="44" y1="43" x2="96" y2="43" stroke="url(#cd-gold)" stroke-width="1.5"/>
  <!-- CADILLAC text -->
  <text x="70" y="97" text-anchor="middle" font-size="7" font-weight="700" font-family="Arial,sans-serif" fill="url(#cd-gold)" letter-spacing="2">CADILLAC</text>
</svg>
