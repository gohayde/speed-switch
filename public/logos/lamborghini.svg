<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 110" role="img"><title>Lamborghini</title>
  <defs>
    <linearGradient id="lb-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5D060"/>
      <stop offset="0.5" stop-color="#C9A020"/>
      <stop offset="1" stop-color="#E8C840"/>
    </linearGradient>
  </defs>
  <!-- Shield background -->
  <path d="M45,3 L87,16 L87,65 Q87,95 45,107 Q3,95 3,65 L3,16 Z" fill="#0D0D0D"/>
  <!-- Gold shield border -->
  <path d="M45,3 L87,16 L87,65 Q87,95 45,107 Q3,95 3,65 L3,16 Z" fill="none" stroke="url(#lb-gold)" stroke-width="2.5"/>
  <!-- Inner shield border -->
  <path d="M45,9 L81,20 L81,65 Q81,89 45,100 Q9,89 9,65 L9,20 Z" fill="none" stroke="url(#lb-gold)" stroke-width="0.8" opacity="0.6"/>
  <!-- Bull silhouette (raging bull facing right) -->
  <!-- Body -->
  <ellipse cx="45" cy="58" rx="22" ry="16" fill="url(#lb-gold)"/>
  <!-- Head -->
  <ellipse cx="64" cy="48" rx="12" ry="10" fill="url(#lb-gold)"/>
  <!-- Snout -->
  <ellipse cx="74" cy="50" rx="5" ry="4" fill="url(#lb-gold)"/>
  <!-- Horns -->
  <path d="M60,40 Q54,28 46,26 Q50,32 52,38" fill="url(#lb-gold)" stroke="url(#lb-gold)" stroke-width="1"/>
  <path d="M68,39 Q66,26 62,22 Q64,30 64,38" fill="url(#lb-gold)" stroke="url(#lb-gold)" stroke-width="1"/>
  <!-- Front legs -->
  <rect x="28" y="70" width="7" height="16" rx="3" fill="url(#lb-gold)"/>
  <rect x="38" y="72" width="7" height="14" rx="3" fill="url(#lb-gold)"/>
  <!-- Rear legs -->
  <rect x="52" y="70" width="7" height="16" rx="3" fill="url(#lb-gold)"/>
  <rect x="60" y="68" width="7" height="14" rx="3" fill="url(#lb-gold)"/>
  <!-- Tail -->
  <path d="M23,55 Q10,45 12,35 Q14,45 20,52" fill="url(#lb-gold)" stroke="url(#lb-gold)" stroke-width="2" fill-opacity="0.8"/>
  <!-- Eye -->
  <circle cx="70" cy="47" r="2" fill="#0D0D0D"/>
  <!-- LAMBORGHINI text -->
  <text x="45" y="107" text-anchor="middle" font-size="5.5" font-weight="700" font-family="Arial,sans-serif" fill="url(#lb-gold)" letter-spacing="1">LAMBORGHINI</text>
</svg>
