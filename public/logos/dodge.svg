<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img"><title>Dodge</title>
  <defs>
    <linearGradient id="dg-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/>
      <stop offset="0.35" stop-color="#C8C8C8"/>
      <stop offset="0.7" stop-color="#808080"/>
      <stop offset="1" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>
  <!-- Outer rhombus frame -->
  <polygon points="100,4 196,28 196,52 100,76 4,52 4,28" fill="none" stroke="url(#dg-chrome)" stroke-width="2.5"/>
  <!-- Inner rhombus accent line -->
  <polygon points="100,11 186,31 186,49 100,69 14,49 14,31" fill="none" stroke="url(#dg-chrome)" stroke-width="0.8" opacity="0.5"/>
  <!-- Red accent stripe (Dodge red) -->
  <polygon points="100,16 180,33 180,47 100,64 20,47 20,33" fill="#CC0000" opacity="0.15"/>
  <!-- DODGE wordmark -->
  <text x="100" y="46" text-anchor="middle" font-size="18" font-weight="900" font-family="Arial Black,Arial,sans-serif" fill="url(#dg-chrome)" letter-spacing="3">DODGE</text>
</svg>
