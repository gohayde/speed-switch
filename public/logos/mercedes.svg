<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"><title>Mercedes-Benz</title>
  <defs>
    <linearGradient id="mb-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/>
      <stop offset="0.35" stop-color="#B0B0B0"/>
      <stop offset="0.65" stop-color="#888888"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
    <linearGradient id="mb-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <!-- Outer chrome ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#mb-chrome)" stroke-width="5"/>
  <!-- Inner circle border (thin) -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#mb-chrome)" stroke-width="0.8" opacity="0.5"/>
  <!-- Star top arm -->
  <polygon points="50,7 46.5,50 53.5,50" fill="url(#mb-chrome)"/>
  <!-- Star bottom-left arm (rotate 120°) -->
  <polygon points="50,7 46.5,50 53.5,50" fill="url(#mb-chrome)" transform="rotate(120 50 50)"/>
  <!-- Star bottom-right arm (rotate 240°) -->
  <polygon points="50,7 46.5,50 53.5,50" fill="url(#mb-chrome)" transform="rotate(240 50 50)"/>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="3" fill="url(#mb-chrome)"/>
</svg>
