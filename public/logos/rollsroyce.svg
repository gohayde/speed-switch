<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img"><title>Rolls-Royce</title>
  <defs>
    <linearGradient id="rr-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E8D0"/>
      <stop offset="0.4" stop-color="#C9A84C"/>
      <stop offset="1" stop-color="#E8D090"/>
    </linearGradient>
  </defs>
  <!-- Outer badge rect with rounded corners -->
  <rect x="4" y="4" width="192" height="72" rx="8" fill="none" stroke="url(#rr-g)" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="64" rx="6" fill="none" stroke="url(#rr-g)" stroke-width="0.8" opacity="0.5"/>
  <!-- Double R monogram -->
  <text x="100" y="56" text-anchor="middle" font-size="46" font-weight="900" font-family="Times New Roman,Georgia,serif" fill="url(#rr-g)" letter-spacing="-4">RR</text>
  <!-- Rolls-Royce text below -->
  <text x="100" y="73" text-anchor="middle" font-size="7.5" font-weight="600" font-family="Arial,sans-serif" fill="url(#rr-g)" letter-spacing="3">ROLLS-ROYCE</text>
</svg>
